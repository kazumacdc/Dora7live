<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>Dora • Links</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Cormorant+Garamond:wght@500;600&display=swap');

*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;font-family:Orbitron,Arial,sans-serif;background:#000;color:#fff}
body{
  min-height:100vh;display:flex;justify-content:center;align-items:center;
  overflow-x:hidden;position:relative;
  background:
    radial-gradient(circle at 50% 20%,rgba(15,60,190,.16),transparent 32%),
    radial-gradient(circle at 50% 95%,rgba(10,40,150,.10),transparent 38%),
    #000;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.28;
  background-image:
    linear-gradient(rgba(70,130,255,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(70,130,255,.04) 1px,transparent 1px);
  background-size:42px 42px;
  mask-image:linear-gradient(to bottom,transparent,#000 20%,#000 80%,transparent);
}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(circle at 50% 50%,transparent 55%,rgba(0,0,0,.55) 100%);
}
.wrap{width:min(430px,92vw);padding:35px 0;position:relative;z-index:1}
.profile-area{text-align:center;margin-bottom:30px}
.avatar{
  width:190px;height:190px;margin:0 auto 24px;position:relative;
  border-radius:50%;padding:7px;
  transform-style:preserve-3d;
  filter:drop-shadow(0 0 22px rgba(30,80,255,.5));
}
.avatar::before,.avatar::after{
  content:"";position:absolute;inset:-8px;border-radius:50%;
  background:conic-gradient(from 0deg,transparent 0 14%,#0a1f6b 21%,#1e50ff 29%,#bcdcff 34%,#1e50ff 39%,transparent 47% 61%,#0a1f6b 68%,#3a70ff 74%,transparent 80% 100%);
  animation:spin 6s linear infinite;z-index:-2;
}
.avatar::after{inset:-16px;filter:blur(14px);opacity:.55;animation-duration:9s}
.avatar img{
  width:100%;height:100%;display:block;object-fit:cover;border-radius:50%;
  border:2px solid rgba(150,200,255,.85);
  box-shadow:inset 0 0 25px #000,0 0 30px rgba(20,80,255,.32);
  background:#050608;
}
@keyframes spin{to{transform:rotate(360deg)}}

.name{
  font-size:32px;letter-spacing:7px;font-weight:800;color:#ffffff;
  text-shadow:0 0 10px rgba(255,255,255,.85),0 0 26px rgba(120,170,255,.55),0 0 50px rgba(30,80,255,.35);
}
.divider{width:34px;height:1px;margin:14px auto 0;background:linear-gradient(90deg,transparent,#c9a24a,transparent);opacity:.8}
.subtitle{margin-top:10px;font-family:'Cormorant Garamond',Arial,sans-serif;font-size:13px;letter-spacing:4px;color:#8fa3c4;text-transform:uppercase;font-weight:600}

.links{display:grid;gap:15px}
.link{
  position:relative;display:flex;align-items:center;gap:17px;
  width:100%;padding:19px 21px;text-decoration:none;color:#dce8ff;
  background:linear-gradient(150deg,rgba(8,12,24,.97),rgba(0,0,0,.98));
  border:1px solid rgba(60,110,255,.35);border-radius:16px;
  box-shadow:0 10px 30px rgba(0,0,0,.6),inset 0 0 20px rgba(20,70,255,.04),inset 0 1px 0 rgba(150,190,255,.08);
  transition:.25s ease;overflow:hidden;
  outline:none;-webkit-tap-highlight-color:transparent;
}
.link:focus,.link:focus-visible,.link:active{
  outline:none;
}
.link::before{
  content:"";position:absolute;left:-100%;top:0;width:60%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(150,190,255,.12),transparent);
  transform:skewX(-18deg);transition:.55s;
}
.link:hover{transform:translateY(-4px) scale(1.01);border-color:#3a70ff;box-shadow:0 14px 40px rgba(20,70,255,.25),inset 0 0 25px rgba(20,70,255,.08)}
.link:hover::before{left:150%}
.icon{
  width:45px;height:45px;display:grid;place-items:center;flex:none;border-radius:12px;
  border:1px solid rgba(80,140,255,.4);background:linear-gradient(160deg,#060a16,#020204);
  color:#7fb3ff;box-shadow:0 0 16px rgba(20,80,255,.18),inset 0 1px 0 rgba(150,190,255,.1);
}
.icon svg{width:22px;height:22px;fill:currentColor}
.label{font-size:16px;font-weight:700;letter-spacing:1.5px;color:#f0f5ff;text-shadow:0 0 10px rgba(80,140,255,.4)}
.desc{display:block;margin-top:4px;font-family:'Cormorant Garamond',Arial,sans-serif;font-size:12px;color:#7488a8;letter-spacing:.5px;font-weight:600}
.arrow{margin-left:auto;color:#5e94ff;font-size:18px;transition:.25s}
.link:hover .arrow{transform:translateX(4px);text-shadow:0 0 10px #4d84ff}

/* Kick — verde original preservado */
.link.kick .icon{color:#53fc18;border-color:rgba(83,252,24,.45);box-shadow:0 0 16px rgba(83,252,24,.2),inset 0 1px 0 rgba(150,255,120,.12)}
.link.kick .label{color:#8bff5c;text-shadow:0 0 10px rgba(83,252,24,.5)}
.link.kick .arrow{color:#7dfa4a}
.link.kick:hover{border-color:#53fc18;box-shadow:0 14px 40px rgba(83,252,24,.22),inset 0 0 25px rgba(83,252,24,.08)}
.link.kick:hover .arrow{text-shadow:0 0 10px #53fc18}

/* TikTok — ciano + rosa da marca */
.link.tiktok .icon svg{fill:#f2f2f2;filter:drop-shadow(-1.5px 0 0 #fe2c55) drop-shadow(1.5px 0 0 #25f4ee)}
.link.tiktok .icon{border-color:rgba(37,244,238,.4)}
.link.tiktok .label{background:linear-gradient(90deg,#25f4ee,#fe2c55);-webkit-background-clip:text;background-clip:text;color:transparent}
.link.tiktok .arrow{color:#5ee6df}
.link.tiktok:hover{border-color:#25f4ee;box-shadow:0 14px 40px rgba(254,44,85,.18),inset 0 0 25px rgba(37,244,238,.1)}
.link.tiktok:hover .arrow{text-shadow:0 0 10px #fe2c55}

/* LivePix — atualizado para o verde oficial do Pix (#32BCAD) */
.link.livepix .icon{color:#32BCAD;border-color:rgba(50,188,173,.45);box-shadow:0 0 16px rgba(50,188,173,.18),inset 0 1px 0 rgba(150,255,240,.1)}
.link.livepix .label{color:#5cebdc;text-shadow:0 0 10px rgba(50,188,173,.5)}
.link.livepix .arrow{color:#32BCAD}
.link.livepix:hover{border-color:#32BCAD;box-shadow:0 14px 40px rgba(50,188,173,.22),inset 0 0 25px rgba(50,188,173,.08)}
.link.livepix:hover .arrow{text-shadow:0 0 10px #32BCAD}

.footer{text-align:center;margin-top:28px;font-family:'Cormorant Garamond',Arial,sans-serif;color:#3e4f70;font-size:11px;letter-spacing:3px;font-weight:600}
@media(max-width:420px){.avatar{width:165px;height:165px}.name{font-size:26px;letter-spacing:5px}.link{padding:16px 18px}.label{font-size:14px}}
</style>
</head>
